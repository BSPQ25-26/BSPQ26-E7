name: Documentation Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate Javadoc
        working-directory: lablend-api/backend
        run: mvn -B javadoc:javadoc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doc dependencies
        working-directory: lablend-api/backend
        run: python -m pip install --upgrade pip && python -m pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        working-directory: lablend-api/backend
        run: python -m sphinx -b html docs docs/_build/html

      - name: Copy Javadoc into site
        working-directory: lablend-api/backend
        run: |
          mkdir -p docs/_build/html/javadoc
          cp -r target/site/apidocs/* docs/_build/html/javadoc/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lablend-api/backend/docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
